name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write # needed to create releases and commit changelog
  issues: write # comment on released issues; open an issue when a release fails
  pull-requests: write # comment on released PRs

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history & tags

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
