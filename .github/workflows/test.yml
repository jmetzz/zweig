name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZG_REQUIRE_PTY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: make test

  bats-bash43:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: make test-bash43
